name: Release with Changelog (Fast Build)

on:
  push:
    branches:
      - main
      - develop
      - release/**
      - v2
      - v2-develop
      - v2.0.0beta*
      - 'v2*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v2.0.0)'
        required: true
        type: string
      draft:
        description: 'Create as draft'
        default: true
        type: boolean

env:
  APP_NAME: "Papyrus"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"
  ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"

jobs:
  # Job 1: Build Frontend (只运行一次，所有平台共享)
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    outputs:
      frontend-hash: ${{ steps.cache-frontend.outputs.cache-primary-key }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Frontend Build
        id: cache-frontend
        uses: actions/cache@v4
        with:
          path: frontend/dist
          key: frontend-${{ hashFiles('frontend/**/*.js', 'frontend/**/*.ts', 'frontend/**/*.tsx', 'frontend/**/*.json', 'frontend/**/*.css') }}

      - name: Build Frontend
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # Job 2: 运行测试
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip wheel
          pip install pytest pytest-asyncio httpx
          pip install -r requirements.txt

      - name: Run Tests
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          echo "Running tests with PYTHONPATH=$PYTHONPATH:src"
          PYTHONPATH=src python scripts/verify-tests.py

  # Job 3: 构建各平台应用
  build:
    name: Build ${{ matrix.platform }}
    needs: [build-frontend, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows"
            os: windows-latest
            artifact: "Papyrus-Win-x64"
          - platform: "macos"
            os: macos-latest
            artifact: "Papyrus-Apple-Silicon-arm64"
          - platform: "linux"
            os: ubuntu-latest
            artifact: "Papyrus-Linux-x64"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 下载预构建的 Frontend
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # 设置 Node.js（用于 Electron Builder）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 只安装根目录依赖（不需要 frontend 的 dev 依赖）
      - name: Install Node Dependencies
        run: npm ci

      # 设置 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # 安装 Python 依赖（最小化）
      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip wheel
          pip install pyinstaller
          pip install -r requirements.txt

      # PyInstaller 缓存
      - name: Cache PyInstaller
        uses: actions/cache@v4
        with:
          path: |
            build
            *.pyc
          key: pyinstaller-${{ matrix.platform }}-${{ hashFiles('requirements.txt', 'PapyrusAPI.spec') }}
          restore-keys: |
            pyinstaller-${{ matrix.platform }}-

      # 构建 Python 后端
      - name: Build Python Backend
        run: pyinstaller PapyrusAPI.spec --distpath dist-python

      # 优化 Python 构建
      - name: Optimize Python Build
        shell: bash
        run: |
          echo "Running build optimization..."
          python scripts/optimize-build.py
          echo ""
          echo "Python build size after optimization:"
          du -sh dist-python/Papyrus/ 2>/dev/null || echo "dist-python/Papyrus/ not found"

      # 验证 Python 构建
      - name: Verify Python Build
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            EXECUTABLE="dist-python/Papyrus/Papyrus.exe"
          else
            EXECUTABLE="dist-python/Papyrus/Papyrus"
          fi
          
          if [ ! -f "$EXECUTABLE" ]; then
            echo "❌ Error: Python executable not found at $EXECUTABLE"
            exit 1
          fi
          
          SIZE_MB=$(du -m "$EXECUTABLE" | cut -f1)
          echo "✅ Python executable built: $EXECUTABLE (${SIZE_MB}MB)"
          
          TOTAL_SIZE=$(du -sm dist-python/Papyrus/ | cut -f1)
          echo "✅ Total directory size: ${TOTAL_SIZE}MB"
          
          if [ "$TOTAL_SIZE" -lt 25 ]; then
            echo "❌ Error: Build directory too small (${TOTAL_SIZE}MB), may be incomplete"
            exit 1
          fi

      # Electron Builder 缓存
      - name: Cache Electron Builder
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ matrix.platform }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ matrix.platform }}-

      # 构建 Electron 应用
      - name: Build Electron App
        run: npx electron-builder --${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 验证 Electron 构建
      - name: Verify Electron Build
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            RESOURCES_DIR="dist-electron/win-unpacked/resources"
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            RESOURCES_DIR="dist-electron/mac-arm64/Papyrus.app/Contents/Resources"
          else
            RESOURCES_DIR="dist-electron/linux-unpacked/resources"
          fi
          
          if [ ! -d "$RESOURCES_DIR" ]; then
            echo "❌ Error: Resources directory not found: $RESOURCES_DIR"
            exit 1
          fi
          
          echo "✅ Electron build verified"

      # 上传 Windows Setup
      - name: Upload Windows Setup
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-Setup
          path: dist-electron/*-Setup-*.exe
          retention-days: 7
          if-no-files-found: ignore

      # 上传 Windows Portable
      - name: Upload Windows Portable
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-Portable
          path: dist-electron/*-Portable-*.exe
          retention-days: 7
          if-no-files-found: ignore

      # 上传 Windows Unpacked
      - name: Upload Windows Unpacked
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-Unpacked
          path: dist-electron/win-unpacked/**
          retention-days: 7
          if-no-files-found: ignore

      # 上传 macOS DMG
      - name: Upload macOS DMG
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-DMG
          path: dist-electron/**/*.dmg
          retention-days: 7
          if-no-files-found: ignore

      # 上传 macOS ZIP
      - name: Upload macOS ZIP
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-ZIP
          path: dist-electron/**/*.zip
          retention-days: 7
          if-no-files-found: ignore

      # 上传 macOS Unpacked
      - name: Upload macOS Unpacked
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-Unpacked
          path: dist-electron/mac-arm64/**
          retention-days: 7
          if-no-files-found: ignore

      # 上传 Linux AppImage
      - name: Upload Linux AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-AppImage
          path: dist-electron/**/*.AppImage
          retention-days: 7
          if-no-files-found: ignore

      # 上传 Linux DEB
      - name: Upload Linux DEB
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-DEB
          path: dist-electron/**/*.deb
          retention-days: 7
          if-no-files-found: ignore

      # 上传 Linux TAR.GZ
      - name: Upload Linux TAR.GZ
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-TAR
          path: dist-electron/**/*.tar.gz
          retention-days: 7
          if-no-files-found: ignore

      # 上传 Linux Unpacked
      - name: Upload Linux Unpacked
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-Unpacked
          path: dist-electron/linux-unpacked/**
          retention-days: 7
          if-no-files-found: ignore

  # Job 4: 创建 Release
  release:
    name: Create Release with Changelog
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Extract Changelog
        id: changelog
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "Extracting changelog for version: $VERSION"
          node scripts/extract-changelog.js "$VERSION" >> $GITHUB_OUTPUT
          echo "=== Extracted Changelog ==="
          cat RELEASE_NOTES.md
          echo "==========================="

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Papyrus-*
          merge-multiple: true

      - name: List Artifacts
        run: |
          echo "Build artifacts:"
          find artifacts/ -type f -name "*" | sort

      - name: Determine Release Type
        id: release_type
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$TAG" == *"alpha"* ]] || [[ "$TAG" == *"beta"* ]] || [[ "$TAG" == *"rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*-Setup-*.exe
            artifacts/*-Portable-*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.tar.gz
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: ${{ github.event.inputs.draft != 'false' }}
          prerelease: ${{ steps.release_type.outputs.is_prerelease == 'true' }}
          generate_release_notes: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Changelog as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
